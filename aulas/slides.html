<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Aulas — ordem atual</title><style>body{margin:0;background:#080a0f;color:white;font:18px Arial}img{display:block;width:100vw;height:calc(100vh - 52px);object-fit:contain}nav{height:52px;display:flex;gap:20px;align-items:center;justify-content:center}button{font:inherit}a{color:#74a0ff}</style><img id="slide" alt="Slide da aula"><nav><button id="prev">Anterior</button><span id="count"></span><button id="next">Próximo</button><a href="USAR-NO-OBS.txt">Guia OBS</a></nav><script>let n=1;function show(){let a=n<=4?1:n<=8?2:n<=12?3:4;document.getElementById('slide').src='jpg/'+String(n).padStart(2,'0')+'-aula-'+String(a).padStart(2,'0')+'.jpg';document.getElementById('count').textContent=n+' / 19';document.getElementById('prev').disabled=n===1;document.getElementById('next').disabled=n===19}function move(d){n=Math.max(1,Math.min(19,n+d));show()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});show();</script></html>
